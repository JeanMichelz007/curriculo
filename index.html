<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Currículo</title>
</head>
<body>
    <main class="container">

        <header>
            <img id="fotoPerfil" src="" alt="Foto de Perfil">
            <h1 id="nomeCompleto"></h1>
            <p id="tituloProfissional"></p>
            <small id="metadados"></small>
        </header>

        <section>
            <h2>Informações Pessoais</h2>
            <ul id="informacoesPessoais"></ul>
        </section>

        <section>
            <h2>Resumo Profissional</h2>
            <div id="resumoProfissional"></div>
        </section>

        <section>
            <h2>Experiência Profissional</h2>
            <div id="experienciaProfissional"></div>
        </section>

        <section>
            <h2>Formação Acadêmica</h2>
            <div id="formacaoAcademica"></div>
        </section>

        <section>
            <h2>Habilidades</h2>
            <ul id="habilidades"></ul>
        </section>

        <section>
            <h2>Idiomas</h2>
            <ul id="idiomas"></ul>
        </section>

        <section>
            <h2>Certificações</h2>
            <div id="certificacoes"></div>
        </section>

        <section>
            <h2>Projetos</h2>
            <div id="projetos"></div>
        </section>

        <section>
            <h2>Cursos</h2>
            <ul id="cursos"></ul>
        </section>

        <section>
            <h2>Informações Adicionais</h2>
            <ul id="informacoesAdicionais"></ul>
        </section>

        <section>
            <h2>Preferências</h2>
            <ul id="preferencias"></ul>
        </section>

    </main>

    <script src="main.js" defer></script>
</body>
</html>
